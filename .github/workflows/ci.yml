name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            native: win-x64
            arch: x64
            test: true
          # Cross-compiled on the x64 runner, so its tests cannot run here; this leg makes sure the
          # ARM64 engine and package still build before a release needs them.
          - name: Windows ARM64
            os: windows-latest
            native: win-arm64
            arch: ARM64
            test: false
          - name: macOS
            os: macos-latest
            native: osx
            test: true
          - name: Linux
            os: ubuntu-latest
            native: linux-x64
            test: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      BUILD_TESTS: ${{ matrix.test && 'ON' || 'OFF' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Ninja
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ninja || true; fi
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y ninja-build e2fsprogs; fi # mke2fs builds the ext4 test images

      # Windows: no -G, so CMake uses the newest Visual Studio on the runner. This needs no developer
      # command prompt, whose environment (e.g. Platform=x64) would leak into the .NET build steps.
      - name: Configure native engine (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake -S . -B artifacts/native-build/ci -A ${{ matrix.arch }}
          "-DEMMASCAN_OUTPUT_DIR=${{ github.workspace }}/artifacts/native/${{ matrix.native }}"
          "-DEMMASCAN_BUILD_TESTS=$env:BUILD_TESTS"

      - name: Configure native engine (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          extra=()
          if [ "$RUNNER_OS" = "macOS" ]; then extra=("-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" "-DCMAKE_OSX_DEPLOYMENT_TARGET=12.0"); fi
          cmake -S . -B artifacts/native-build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release \
                "-DEMMASCAN_OUTPUT_DIR=$GITHUB_WORKSPACE/artifacts/native/${{ matrix.native }}" \
                "-DEMMASCAN_BUILD_TESTS=$BUILD_TESTS" "${extra[@]}"

      # --config / -C select Release for the multi-config Visual Studio generator; Ninja ignores them.
      - name: Build native engine
        run: cmake --build artifacts/native-build/ci --config Release

      - name: Native tests
        if: matrix.test
        run: ctest --test-dir artifacts/native-build/ci -C Release --output-on-failure --no-tests=error

      # Runners have passwordless sudo and loop devices: scan a loop-mounted ext4 image from its block device.
      - name: Native ext4 test as root (Linux)
        if: matrix.test && runner.os == 'Linux'
        run: sudo artifacts/native-build/ci/native/emmascan/tests/emmascan_tests "ext4: as root a loop-mounted image scanned in ext4 mode equals the walker exactly"

      - name: Build .NET
        run: dotnet build EmmaSpace.slnx -c Release -p:EmmaSkipNative=true

      - name: .NET tests
        if: matrix.test
        run: dotnet test --project tests/EmmaSpace.Core.Tests -c Release -p:EmmaSkipNative=true --no-build

      # Releases pack macOS from a ready .app with Emma Space's own Info.plist (build/bundle-macos.ps1), which
      # declares .emmasnap documents. Check that bundle, that Velopack packs it (unsigned), and that the packed
      # app still has the document type and its icon.
      - name: Package check (macOS)
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet tool restore
          dotnet publish src/EmmaSpace.App -c Release -r osx-arm64 --self-contained -p:EmmaSkipNative=true `
            -p:EmmaNativePreset=osx -p:DebugType=None -p:CopyDebugSymbolFilesFromPackages=false -o artifacts/pack-input/osx-arm64
          $app = pwsh build/bundle-macos.ps1 -Version 0.0.1 -PackDir artifacts/pack-input/osx-arm64 -Runtime osx-arm64 `
                   -OutDir artifacts/bundle | Select-Object -Last 1
          plutil -lint "$app/Contents/Info.plist"
          dotnet vpk pack --packId EmmaSpace --packVersion 0.0.1 --packDir $app --mainExe EmmaSpace --packTitle 'Emma Space' `
            --icon src/EmmaSpace.App/Assets/emmaspace.icns --runtime osx-arm64 --channel osx-arm64 --outputDir artifacts/releases/osx-arm64
          $zip = Get-ChildItem artifacts/releases/osx-arm64 -Filter '*Portable.zip' | Select-Object -First 1
          ditto -x -k $zip.FullName artifacts/portable
          $packed = (Get-ChildItem artifacts/portable -Filter '*.app' -Directory | Select-Object -First 1).FullName
          $icon = plutil -extract CFBundleDocumentTypes.0.CFBundleTypeIconFile raw "$packed/Contents/Info.plist"
          $id = plutil -extract CFBundleIdentifier raw "$packed/Contents/Info.plist"
          if ($icon -ne 'emmasnap.icns' -or $id -ne 'com.alexxfromgit.emmaspace') { throw "Unexpected Info.plist: icon '$icon', id '$id'" }
          if (-not (Test-Path "$packed/Contents/Resources/emmasnap.icns")) { throw 'emmasnap.icns is missing from the packed app' }
          Write-Host "Packed $packed declares .emmasnap documents with their icon"

      # CI builds are versioned below the next release: <current version>-ci.<run number>.
      - name: CI version
        if: runner.os == 'Windows'
        id: version
        shell: pwsh
        run: |
          [xml] $props = Get-Content Directory.Build.props
          "value=$($props.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)-ci.${{ github.run_number }}" >> $env:GITHUB_OUTPUT

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $rid = 'win-${{ matrix.arch }}'.ToLowerInvariant()
          dotnet tool restore
          dotnet publish src/EmmaSpace.App -c Release -r $rid --self-contained -p:EmmaSkipNative=true `
            -p:EmmaNativePreset=${{ matrix.native }} -p:Version=${{ steps.version.outputs.value }} `
            -p:DebugType=None -p:CopyDebugSymbolFilesFromPackages=false -o artifacts/pack-input/$rid
          if (-not (Test-Path artifacts/pack-input/$rid/emmascan.dll)) { throw "emmascan.dll is missing from the package" }
          dotnet vpk pack --packId EmmaSpace --packVersion ${{ steps.version.outputs.value }} --packDir artifacts/pack-input/$rid `
            --mainExe EmmaSpace.exe --packTitle "Emma Space" --packAuthors "Alexander Rubtsov" `
            --icon src/EmmaSpace.App/Assets/emmaspace.ico --runtime $rid --channel $rid --outputDir artifacts/releases/$rid

      - name: Upload installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: EmmaSpace-${{ matrix.native }}
          path: artifacts/releases/${{ matrix.native }}
          retention-days: 14

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # actionlint also runs shellcheck on every run: block.
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
