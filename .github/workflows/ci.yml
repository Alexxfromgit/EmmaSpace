name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            native: win-x64
          - name: macOS
            os: macos-latest
            native: osx
          - name: Linux
            os: ubuntu-latest
            native: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Ninja
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ninja || true; fi
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y ninja-build; fi

      # Windows: no -G, so CMake uses the newest Visual Studio on the runner. This needs no developer
      # command prompt, whose environment (e.g. Platform=x64) would leak into the .NET build steps.
      - name: Configure native engine (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake -S . -B artifacts/native-build/ci -A x64
          "-DEMMASCAN_OUTPUT_DIR=${{ github.workspace }}/artifacts/native/${{ matrix.native }}"

      - name: Configure native engine (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          extra=()
          if [ "$RUNNER_OS" = "macOS" ]; then extra=("-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" "-DCMAKE_OSX_DEPLOYMENT_TARGET=12.0"); fi
          cmake -S . -B artifacts/native-build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release \
                "-DEMMASCAN_OUTPUT_DIR=$GITHUB_WORKSPACE/artifacts/native/${{ matrix.native }}" "${extra[@]}"

      # --config / -C select Release for the multi-config Visual Studio generator; Ninja ignores them.
      - name: Build native engine
        run: cmake --build artifacts/native-build/ci --config Release

      - name: Native tests
        run: ctest --test-dir artifacts/native-build/ci -C Release --output-on-failure --no-tests=error

      - name: Build .NET
        run: dotnet build EmmaSpace.slnx -c Release -p:EmmaSkipNative=true

      - name: .NET tests
        run: dotnet test --project tests/EmmaSpace.Core.Tests -c Release -p:EmmaSkipNative=true --no-build

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool restore
          dotnet publish src/EmmaSpace.App -c Release -r win-x64 --self-contained -p:EmmaSkipNative=true `
            -p:DebugType=None -p:CopyDebugSymbolFilesFromPackages=false -o artifacts/pack-input/win-x64
          dotnet vpk pack --packId EmmaSpace --packVersion 0.1.0-ci.${{ github.run_number }} --packDir artifacts/pack-input/win-x64 `
            --mainExe EmmaSpace.exe --packTitle "Emma Space" --icon src/EmmaSpace.App/Assets/emmaspace.ico `
            --outputDir artifacts/releases/win-x64

      - name: Upload installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: EmmaSpace-win-x64
          path: artifacts/releases/win-x64
          retention-days: 14
