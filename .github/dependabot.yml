version: 2
updates:
  # NuGet (central package management in Directory.Packages.props) and the vpk local tool
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # "deps: bump …" PR titles: Release Please lists them and cuts a patch release.
    commit-message:
      prefix: deps
    groups:
      avalonia:
        patterns: ["Avalonia*"]
      testing:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk"]
      velopack:
        patterns: ["Velopack", "vpk"]
      dotnet:
        patterns: ["Microsoft.Extensions.*", "System.*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # "ci: bump …": workflow updates do not need a release.
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
